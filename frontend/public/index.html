<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generation - Inicio de sesión / Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Bienvenido a GenPass</h1>
            <p>Inicia sesión o regístrate para acceder al generador de contraseñas</p>

            <!-- Formulario de inicio de sesión -->
            <div id="loginForm">
                <h2>Iniciar Sesión</h2>
                <input type="text" id="usernameLogin" placeholder="Usuario" required>
                <input type="password" id="passwordLogin" placeholder="Contraseña" required>
                <button onclick="loginUser()">Iniciar Sesión</button>
                <p class="redirect">¿No tienes cuenta? <a href="#" onclick="showRegisterForm()">Regístrate</a></p>
            </div>

            <!-- Formulario de registro -->
            <div id="registerForm" style="display:none;">
                <h2>Registrar Usuario</h2>
                <input type="text" id="usernameRegister" placeholder="Usuario" required>
                <input type="password" id="passwordRegister" placeholder="Contraseña" required>
                <button onclick="registerUser()">Registrarse</button>
                <p class="redirect">¿Ya tienes cuenta? <a href="#" onclick="showLoginForm()">Iniciar Sesión</a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
